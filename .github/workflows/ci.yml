name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moonbit:
    name: MoonBit fmt / check / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit (latest stable)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version

      - name: Format check
        run: moon fmt --check

      - name: Type/interface check (deny warnings)
        run: moon check --deny-warn

      - name: Build (no --release)
        run: moon build
